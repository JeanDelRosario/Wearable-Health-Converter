  <style rel="stylesheet" crossorigin>:root{font-family:system-ui,sans-serif;color:#1d1d1f;background:#fff}*{box-sizing:border-box}body{margin:0}.page{max-width:680px;margin:0 auto;padding:24px 16px 48px}h1{margin-top:0}form,fieldset,section{margin:20px 0}fieldset{border:1px solid #bbb}label,input,button,select{display:block;margin:8px 0}input[type=file],select{max-width:100%;font:inherit}.actions{display:flex;gap:12px}[hidden]{display:none!important}.warnings{padding:14px 14px 14px 32px;background:#fff7e5;border-radius:4px}.warnings:empty{display:none}.warnings li{margin:8px 0}.checkbox{display:inline-block;margin-right:18px;touch-action:manipulation}.checkbox input{display:inline}.checkbox.long-press-active{background:#e6f4ea;outline:2px solid #167a34;outline-offset:2px}.data-types-locked{background:#f3f4f5;color:#777}.data-types-locked #type-options{opacity:.56}.data-types-locked .checkbox{cursor:not-allowed}.data-types-locked input:disabled{pointer-events:none}.data-types-unlocking{outline:2px solid #a06a00;outline-offset:2px}.data-types-unlocked{background:#f8fffa}.date-fields{display:flex;flex-wrap:wrap;gap:12px}.date-fields+.hint{margin:3px 0 0}.date-fields input[readonly]{background:#f1f1f1;color:#444;cursor:default}button{padding:8px 14px;font:inherit}progress{width:100%}.hint{color:#555;font-size:.9rem}.error{color:#b00020}@media(max-width:480px){.page{padding:16px}}</style>

<body>
  <main class="page">
    <section id="language-choice">
      <h1>Choose your language / Kies uw taal</h1>
      <label for="language-select">Language / Taal</label>
      <select id="language-select"><option value="" selected disabled>Choose / Kies</option><option value="nl">Nederlands</option><option value="en">English</option></select>
    </section>
    <div id="converter-content" hidden>
      <h1>Wearable Health Converter</h1>
      <p id="privacy-note" class="hint"></p>
      <form id="converter-form">
        <label id="file-label" for="file"></label>
        <input id="file" name="file" type="file" accept=".zip,.xml,application/zip,text/xml,application/xml" required />
        <fieldset>
          <legend id="period-label"></legend>
          <div class="date-fields">
            <label for="start-date"><span id="start-label"></span><input id="start-date" type="date" readonly aria-readonly="true" /></label>
            <label for="end-date"><span id="end-label"></span><input id="end-date" type="date" required /></label>
          </div>
          <p class="hint" id="period-hint"></p>
          <label id="zone-label" for="time-zone"></label>
          <select id="time-zone" required></select>
          <p class="hint" id="zone-hint"></p>
        </fieldset>
        <fieldset id="data-types-fieldset" class="data-types-locked">
          <legend><span id="data-label"></span> <span id="type-lock-label"></span></legend>
          <div id="type-options"></div>
          <p class="hint" id="lock-hint"></p>
        </fieldset>
        <p class="hint" id="temperature-hint"></p>
        <div class="actions"><button id="process" type="submit"></button><button id="cancel" type="button" hidden></button></div>
      </form>
      <section aria-live="polite" aria-atomic="true">
        <h2 id="status-heading"></h2>
        <p id="status"></p>
        <progress id="progress" max="100" value="0" hidden></progress>
      </section>
      <section id="results" hidden><h2 id="results-heading"></h2><p id="platform"></p><ul id="coverage"></ul><ul id="warnings" class="warnings"></ul></section>
      <button id="download" type="button" disabled></button>
    </div>
  </main>
</body>
</html>
